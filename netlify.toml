[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # pdf.js is bundled in rather than left as a runtime dependency. Shipping it
  # as an external module meant the function looked for pdf.worker.mjs on disk
  # at runtime and did not find it; inlined, there is nothing to look up.

# Sleeve PDFs are content-hashed by Vite, so a new upload gets a new URL and
# never serves stale from cache.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
